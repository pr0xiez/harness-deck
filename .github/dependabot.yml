version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "@lydell/node-pty"
          - "@vitejs/*"
          - "@vitest/*"
          - "electron"
          - "electron-builder"
          - "electron-vite"
          - "typescript"
          - "vite"
          - "vitest"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
