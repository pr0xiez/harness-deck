name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    # Each installer has to be built on its own platform, so the only choice is
    # where each half runs. macOS uses a self-hosted Mac — free, and the one
    # machine that could ever sign and notarise. Windows uses a GitHub-hosted
    # runner because there is no Windows box registered here; that one is billed
    # (private repo, and Windows minutes count double).
    runs-on: ${{ matrix.runner }}
    # Publishing the installers writes to releases, and this repository leaves
    # the default GITHUB_TOKEN read-only.
    permissions:
      contents: write
    strategy:
      # One platform failing shouldn't throw away the other's installers.
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
          # Self-hosted runners are labelled with their OS automatically, so
          # this pair routes the job to the Mac. It must be registered as a
          # runner on this repository.
          - label: macos
            runner: [self-hosted, macOS]

    steps:
      # v5 and up run on Node 24 and need a self-hosted runner on 2.327.1 or
      # newer — check the Mac's version before bumping these again.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # A release is named from package.json, not from the tag, so a mismatch
      # would publish under the wrong version. Written in node to stay shell
      # agnostic — the Windows runner defaults to PowerShell.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); const p=require('./package.json').version; if (t!==p) { console.error('tag '+t+' does not match package.json '+p); process.exit(1) }"

      - run: npm ci

      - run: npm run typecheck

      # Pure node, no display needed — these run the PtyManager against a stub
      # pty to pin down the session lifecycle (restart races in particular).
      - run: npm test

      # npm resolves node-pty's per-platform prebuilds against the host, so an
      # Apple Silicon runner never fetches the Intel one and the x64 dmg would
      # ship with no pty at all. Pull it in explicitly. Drop this step (and x64
      # from electron-builder.yml) if Intel Macs stop being worth supporting.
      #
      # A package asked for by name is still checked against the real host, so
      # this is EBADPLATFORM without --force, which is what downgrades that
      # error to a warning. Do not set --cpu here: npm 11 would re-resolve every
      # optional dependency for x64 and remove the arm64 build tools. Both pty
      # flavours end up in node_modules and asarUnpack ships both, which is why
      # the arm64 dmg is a few MB heavier than it needs to be — node-pty picks
      # the right one at runtime.
      - name: Add the Intel pty prebuild
        if: runner.os == 'macOS'
        run: npm i --no-save --force @lydell/node-pty-darwin-x64@$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")

      - run: npm run build

      # Boots the app for real and asserts it works: the renderer mounts, the
      # chrome renders, a pane spawns a process and gets its output back, and a
      # restarted pane survives the old process dying. Packaging succeeding says
      # nothing about any of that — a missing node-pty prebuild packages
      # perfectly and fails on the first pane.
      #
      # It needs a window server, so on a self-hosted Mac the runner has to be a
      # LaunchAgent in a logged-in session rather than a daemon. If that is not
      # possible there, restrict this step with `if: runner.os == 'Windows'` —
      # the unit tests above still run everywhere.
      - name: Smoke test
        run: npx electron . --smoke --smoke-json=smoke-${{ matrix.label }}.json

      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.label }}
          path: smoke-${{ matrix.label }}.json
          if-no-files-found: ignore
          retention-days: 7

      # Never electron-builder's own publisher, on either path: both platform
      # jobs would target one release at the same moment, and GitHubPublisher
      # creates the release it uploads into with no answer for the other job
      # creating it first. scripts/publish-release.mjs does the same job in a
      # form that tolerates the race, and uploads the update metadata with the
      # installers.
      #
      # `never` stops it uploading, not writing: since electron-builder 26 the
      # latest*.yml the in-app updater reads is emitted from the publish config
      # in electron-builder.yml regardless of the policy. The step below is what
      # holds that true — turning this to `always` to get the metadata back
      # would only reintroduce the race.
      - name: Package
        run: npx electron-builder --publish never
        env:
          # No Developer ID on the runner: build unsigned rather than pick up
          # whatever identity happens to be in its keychain. To sign for real,
          # delete this and add CSC_LINK + CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The GitHub update channel is this file and nothing else, and a build
      # that stops writing it fails silently everywhere else — installed copies
      # would just never hear about a release again.
      - name: Check the update metadata exists
        run: node -e "const fs=require('fs'); const f=fs.existsSync('release')?fs.readdirSync('release').filter(n=>/^latest.*\.yml$/.test(n)):[]; if(!f.length){console.error('no latest*.yml in release/ — the in-app updater would have nothing to read');process.exit(1)} console.log('update metadata: '+f.join(', '))"

      # A `v*` tag cuts a draft release named for the version. Every other build
      # of main refreshes `latest-main`, a prerelease that always holds the
      # newest installers — merge, wait, download. Workflow artifacts were the
      # obvious alternative and are worse for this: they expire after a
      # fortnight, they arrive wrapped in a second zip, and on a private
      # repository they consume a storage quota that release assets don't.
      - name: Publish
        if: github.event_name != 'pull_request'
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is what would otherwise catch a build that silently produced
      # nothing, and a pull request doesn't publish, so check for the installer
      # directly instead.
      - name: Check the installer exists
        if: github.event_name == 'pull_request'
        run: |
          node -e "const fs=require('fs'); const ext=process.platform==='darwin'?'.dmg':'.exe'; const f=fs.existsSync('release')?fs.readdirSync('release').filter(n=>n.endsWith(ext)):[]; if(!f.length){console.error('no '+ext+' found in release/');process.exit(1)} console.log('built '+f.join(', '))"
