name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    # Every self-hosted runner is labelled with its OS automatically, so the
    # second label is what routes each job to the right machine. Both boxes
    # need to be registered as runners on this repository.
    runs-on: [self-hosted, '${{ matrix.runner }}']
    strategy:
      # One platform failing shouldn't throw away the other's installers.
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: Windows
            artifacts: |
              release/*.exe
              release/*.zip
              release/latest*.yml
          - label: macos
            runner: macOS
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest*.yml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A release is named from package.json, not from the tag, so a mismatch
      # would publish under the wrong version. Written in node to stay shell
      # agnostic — the Windows runner defaults to PowerShell.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); const p=require('./package.json').version; if (t!==p) { console.error('tag '+t+' does not match package.json '+p); process.exit(1) }"

      - run: npm ci

      - run: npm run typecheck

      # npm resolves node-pty's per-platform prebuilds against the host, so an
      # Apple Silicon runner never fetches the Intel one and the x64 dmg would
      # ship with no pty at all. Pull it in explicitly. Drop this step (and x64
      # from electron-builder.yml) if Intel Macs stop being worth supporting.
      - name: Add the Intel pty prebuild
        if: runner.os == 'macOS'
        run: npm i --no-save --os=darwin --cpu=x64 @lydell/node-pty-darwin-x64@1.2.0-beta.12

      - run: npm run build

      # Tags publish a draft GitHub release; every other run just leaves the
      # installers as workflow artifacts. Publishing through electron-builder
      # rather than a generic upload is what produces the latest*.yml metadata
      # that electron-updater reads.
      - name: Package
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID on the runner: build unsigned rather than pick up
          # whatever identity happens to be in its keychain. To sign for real,
          # delete this and add CSC_LINK + CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: harness-deck-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
