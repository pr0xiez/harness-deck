name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    # Each installer has to be built on its own platform, so the only choice is
    # where each half runs. macOS uses a self-hosted Mac — free, and the one
    # machine that could ever sign and notarise. Windows uses a GitHub-hosted
    # runner because there is no Windows box registered here; that one is billed
    # (private repo, and Windows minutes count double).
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing shouldn't throw away the other's installers.
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
            artifacts: |
              release/*.exe
              release/*.zip
              release/latest*.yml
          # Self-hosted runners are labelled with their OS automatically, so
          # this pair routes the job to the Mac. It must be registered as a
          # runner on this repository.
          - label: macos
            runner: [self-hosted, macOS]
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest*.yml

    steps:
      # v5 and up run on Node 24 and need a self-hosted runner on 2.327.1 or
      # newer — check the Mac's version before bumping these again.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A release is named from package.json, not from the tag, so a mismatch
      # would publish under the wrong version. Written in node to stay shell
      # agnostic — the Windows runner defaults to PowerShell.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); const p=require('./package.json').version; if (t!==p) { console.error('tag '+t+' does not match package.json '+p); process.exit(1) }"

      - run: npm ci

      - run: npm run typecheck

      # npm resolves node-pty's per-platform prebuilds against the host, so an
      # Apple Silicon runner never fetches the Intel one and the x64 dmg would
      # ship with no pty at all. Pull it in explicitly. Drop this step (and x64
      # from electron-builder.yml) if Intel Macs stop being worth supporting.
      #
      # --os/--cpu only steer which optional dependencies get resolved; a
      # package asked for by name is still checked against the real host, so
      # this is EBADPLATFORM without --force, which is what downgrades that
      # error to a warning. Both flavours end up in node_modules and asarUnpack
      # ships both, which is why the arm64 dmg is a few MB heavier than it needs
      # to be — node-pty picks the right one at runtime.
      - name: Add the Intel pty prebuild
        if: runner.os == 'macOS'
        run: npm i --no-save --force --os=darwin --cpu=x64 @lydell/node-pty-darwin-x64@1.2.0-beta.12

      - run: npm run build

      # Tags publish a draft GitHub release; every other run just leaves the
      # installers as workflow artifacts. This is a distribution channel only —
      # the in-app updater reads a local update.json written by
      # scripts/release.mjs and never looks at GitHub. Publishing through
      # electron-builder still emits the latest*.yml metadata, so pointing the
      # updater at releases later is a change to updater.ts alone.
      - name: Package
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID on the runner: build unsigned rather than pick up
          # whatever identity happens to be in its keychain. To sign for real,
          # delete this and add CSC_LINK + CSC_KEY_PASSWORD secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Artifact storage counts against the account's quota, so a pull request
      # builds the installers to prove it can, then throws them away.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: harness-deck-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      # The upload is what would otherwise catch a build that silently produced
      # nothing, so on a pull request check for the installer directly.
      - name: Check the installer exists
        if: github.event_name == 'pull_request'
        run: |
          node -e "const fs=require('fs'); const ext=process.platform==='darwin'?'.dmg':'.exe'; const f=fs.existsSync('release')?fs.readdirSync('release').filter(n=>n.endsWith(ext)):[]; if(!f.length){console.error('no '+ext+' found in release/');process.exit(1)} console.log('built '+f.join(', '))"
