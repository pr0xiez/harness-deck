appId: dev.harnessdeck.app
productName: Harness Deck
directories:
  output: release
  buildResources: build
# electron-builder never uploads for us (see .github/workflows/build.yml), but
# this is what makes it write the latest*.yml the in-app updater's GitHub
# channel reads. The updater takes the owner/repo from package.json's
# `repository` instead, since electron-builder.yml is not packaged.
publish:
  provider: github
  owner: pr0xiez
  repo: harness-deck
files:
  - out/**
  - package.json
# node-pty ships a prebuilt .node per platform; it must stay outside the asar.
asarUnpack:
  - "**/node_modules/@lydell/**"
win:
  target:
    - nsis
    - zip
  # The platform belongs in the name because both halves of the build land in
  # one GitHub release, and `${arch}` alone had Windows and macOS both producing
  # a `-x64.zip` — whichever uploaded second would have quietly replaced the
  # other. scripts/release.mjs looks for the nsis one by this name.
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  darkModeSupport: true
  extendInfo:
    NSMicrophoneUsageDescription: Dictate prompts into your agents.
  # Harness Deck spawns whatever binaries the user points it at, so it can never
  # be sandboxed — the Mac App Store is out, and this ships signed + notarised
  # or not at all. The entitlements cover V8's JIT, loading node-pty's unsigned
  # prebuilt .node, and the microphone dictation records from.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: harness-deck
