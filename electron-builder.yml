appId: dev.harnessdeck.app
productName: Harness Deck
directories:
  output: release
  buildResources: build
# Only used when electron-builder is run with `--publish always` (see the
# release job in .github/workflows/build.yml); it uploads to a draft release
# and writes the latest*.yml metadata alongside the installers.
publish:
  provider: github
  owner: pr0xiez
  repo: harness-deck
files:
  - out/**
  - package.json
# node-pty ships a prebuilt .node per platform; it must stay outside the asar.
asarUnpack:
  - "**/node_modules/@lydell/**"
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  # Harness Deck spawns whatever binaries the user points it at, so it can never
  # be sandboxed — the Mac App Store is out, and this ships signed + notarised
  # or not at all. The entitlements cover V8's JIT and loading node-pty's
  # unsigned prebuilt .node under the hardened runtime.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: harness-deck
